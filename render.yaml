services:
  - type: web
    name: medivista-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medivista-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173

databases:
  - name: medivista-postgres
    plan: free
    databaseName: medivista
    user: medivista_user
